{
  "openapi": "3.0.3",
  "info": {
    "title": "PC Club Admin",
    "version": "0.7.0",
    "description": "Этапы 0–5: два личных PIN-входа на одном доверенном браузере, снимок передачи, отдельный пересчёт, ознакомление с заметками и атомарный приём. Только test-mode: политика draft-v1 не проверена на LANGAME, production-мутации заблокированы. История: серверная фильтрация прав и keyset-пагинация, read-only детали и снимки передач. Панель руководителя: серверный снимок состояния без подписи или обхода кассы."
  },
