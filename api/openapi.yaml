{
  "openapi": "3.0.3",
  "info": {
    "title": "PC Club Admin",
    "version": "0.2.0",
    "description": "Реализованный контракт этапов 0–2. Мутации требуют Origin и double-submit CSRF; защищённые мутации также X-Actor-ID и сессионную привязку CSRF. У admin сессии обязательно доверенное устройство. Public manager bootstrap отсутствует. Остальные endpoints ТЗ появятся с реализацией."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
