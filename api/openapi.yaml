  "info": {
    "title": "PC Club Admin",
    "version": "0.3.0",
    "description": "Реализованные этапы 0–3: вход и opening-черновик со снимком чек-листа. Активация, касса и передача недоступны. Авторство из сессии, мутации требуют Origin/CSRF/X-Actor-ID. Bootstrap только manager и с Idempotency-Key, изменения ответов только owner PIN-session на доверенном браузере."
  },
