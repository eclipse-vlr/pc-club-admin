  "components": {
    "schemas": {
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok",
              "ready",
              "blocked",
              "not_ready"
            ]
          },
          "reason": {
            "type": "string",
            "enum": [
              "CASH_POLICY_UNVERIFIED",
              "DATABASE_OR_SCHEMA_UNAVAILABLE"
            ]
          }
        }
      },
      "ApplicationStatus": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "stage",
          "environment",
          "timezone",
          "cash_policy_status",
          "operations_enabled"
        ],
        "properties": {
          "name": {
            "type": "string",
            "enum": [
              "PC Club Admin"
            ]
          },
          "stage": {
            "type": "string",
            "enum": [
              "auth"
            ]
          },
          "environment": {
            "type": "string",
            "enum": [
              "test",
              "production"
            ]
          },
          "timezone": {
            "type": "string"
          },
          "cash_policy_status": {
            "type": "string",
            "enum": [
              "unverified"
            ]
          },
          "operations_enabled": {
            "type": "boolean",
            "enum": [
              false
            ]
          }
        }
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "code",
              "message",
              "request_id"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "request_id": {
                "type": "string"
              }
            }
          }
        }
      },
      "Empty": {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties": {}
      },
      "CSRF": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "csrf_token"
        ],
        "properties": {
          "csrf_token": {
            "type": "string"
          }
        }
      },
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "display_name",
          "manager_login",
          "active",
          "roles",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "display_name": {
            "type": "string"
          },
          "manager_login": {
            "type": "string"
          },
          "active": {
            "type": "boolean"
          },
          "roles": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "admin",
                "manager"
              ]
            }
          },
          "version": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "Identity": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "user",
          "device_trusted"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "device_trusted": {
            "type": "boolean"
          }
        }
      },
      "LoginResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "identity",
          "csrf_token"
        ],
        "properties": {
          "identity": {
            "$ref": "#/components/schemas/Identity"
          },
          "csrf_token": {
            "type": "string"
          }
        }
      },
      "PINLogin": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "user_id",
          "pin"
        ],
        "properties": {
          "user_id": {
            "type": "string",
            "format": "uuid"
          },
          "pin": {
            "type": "string",
            "pattern": "^[0-9]{6}$",
            "writeOnly": true
          }
        }
      },
      "ManagerLogin": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "login",
          "password"
        ],
        "properties": {
          "login": {
            "type": "string",
            "maxLength": 100
          },
          "password": {
            "type": "string",
            "writeOnly": true,
            "maxLength": 256
          }
        }
      },
      "UserInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "display_name",
          "roles"
        ],
        "properties": {
          "display_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "manager_login": {
            "type": "string",
            "pattern": "^[a-z0-9._-]{3,100}$"
          },
          "roles": {
            "type": "array",
            "minItems": 1,
            "maxItems": 2,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "enum": [
                "admin",
                "manager"
              ]
            }
          },
          "pin": {
            "type": "string",
            "pattern": "^[0-9]{6}$",
            "writeOnly": true
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256,
            "writeOnly": true
          }
        }
      },
      "UserPatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "display_name",
          "active",
          "version"
        ],
        "properties": {
          "display_name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "active": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "ResetPIN": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "pin",
          "version"
        ],
        "properties": {
          "pin": {
            "type": "string",
            "pattern": "^[0-9]{6}$",
            "writeOnly": true
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "Password": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "password"
        ],
        "properties": {
          "password": {
            "type": "string",
            "writeOnly": true,
            "maxLength": 256
          }
        }
      },
      "Enrollment": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "expires_in"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "expires_in": {
            "type": "integer",
            "enum": [
              600
            ]
          }
        }
      },
      "RegisterDevice": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "label"
        ],
        "properties": {
          "code": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64,
            "writeOnly": true
          },
          "label": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          }
        }
      },
      "Device": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "label",
          "expires_at",
          "revoked"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "label": {
            "type": "string"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "revoked": {
            "type": "boolean"
          }
        }
      },
      "Reauth": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "pin",
          "action",
          "target_id",
          "revision"
        ],
        "properties": {
          "pin": {
            "type": "string",
            "pattern": "^[0-9]{6}$",
            "writeOnly": true
          },
          "action": {
            "type": "string",
            "enum": [
              "prepare_handover",
              "accept_handover",
              "collection",
              "reverse_collection"
            ]
          },
          "target_id": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "Proof": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "proof",
          "expires_in"
        ],
        "properties": {
          "proof": {
            "type": "string"
          },
          "expires_in": {
            "type": "integer",
            "enum": [
              120
            ]
          }
        }
      }
    },
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-pcclub_session",
        "description": "Production HTTPS: __Host-pcclub_session; test HTTP: pcclub_session. HttpOnly, SameSite=Lax, Secure при HTTPS."
      },
      "deviceCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-pcclub_device",
        "description": "Production HTTPS: __Host-pcclub_device; test HTTP: pcclub_device. В БД только hash, срок и отзыв."
      }
    }
  }
}
