name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: pcclub
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: pcclub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pcclub -d pcclub_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      PIN_PEPPER: ci-synthetic-only-pepper-at-least-32-characters
      APP_ORIGIN: http://127.0.0.1:8080
      DATABASE_URL: postgres://pcclub:ci-synthetic-only@localhost:5432/pcclub_test?sslmode=disable
      TEST_DATABASE_URL: postgres://pcclub:ci-synthetic-only@localhost:5432/pcclub_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.26.9'
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go mod download
      - run: go mod verify
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -race -tags=integration ./internal/storage/postgres ./internal/httpapi -count=1
      - run: go run ./cmd/migrate up
      - run: go build ./cmd/api ./cmd/migrate ./cmd/admin
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Browser handover and read-only history
        env:
          PC_CLUB_BROWSER_TEST: '1'
          PC_CLUB_CHROMIUM: /usr/bin/google-chrome
        run: |
          test -x "$PC_CLUB_CHROMIUM"
          go test -race -tags=integration ./internal/httpapi -run TestHandoverBrowser -count=1 -timeout=150s
      - run: |
          go run ./cmd/api &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/readyz
          curl --fail http://127.0.0.1:8080/api/v1/status
          curl --fail http://127.0.0.1:8080/ | grep 'lang="ru"'
