name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep private documentation out of source
        shell: pwsh
        run: |
          if (git ls-files -- docs) { throw 'Private documentation must stay outside the source repository.' }
      - name: Windows PowerShell 5.1 launcher checks (no application)
        shell: powershell
        run: |
          .\scripts\test-demo.ps1
          .\scripts\test-update.ps1
          .\scripts\test-container-launcher.ps1
      - name: PowerShell 7 launcher checks (no application)
        shell: pwsh
        run: |
          .\scripts\test-demo.ps1
          .\scripts\test-update.ps1
          .\scripts\test-container-launcher.ps1
  foundation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: pcclub
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: pcclub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pcclub -d pcclub_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      PIN_PEPPER: ci-synthetic-only-pepper-at-least-32-characters
      APP_ORIGIN: http://127.0.0.1:8080
      DATABASE_URL: postgres://pcclub:ci-synthetic-only@localhost:5432/pcclub_test?sslmode=disable
      TEST_DATABASE_URL: postgres://pcclub:ci-synthetic-only@localhost:5432/pcclub_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep private documentation out of source
        run: test -z "$(git ls-files -- docs)"
      - name: Check container launcher with the actual Compose parser
        shell: pwsh
        run: ./scripts/test-container-compose.ps1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go mod download
      - run: go mod verify
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: test -z "$(gofmt -l cmd internal migrations)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: PostgreSQL integration and Excel relay crash recovery
        run: go test -race -tags=integration ./internal/storage/postgres ./internal/httpapi ./internal/excelsync -count=1
      - name: Isolated PostgreSQL backup and restore drill
        run: node scripts/test-backup.mjs
      - run: go run ./cmd/migrate up
      - run: go build ./cmd/api ./cmd/migrate ./cmd/admin
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Excel status UI with intercepted API (no Google requests)
        env:
          PC_CLUB_CHROMIUM: /usr/bin/google-chrome
        run: |
          node web/e2e/excel-status.mjs
          node web/e2e/checklist-drafts.mjs
          node web/e2e/handover-recovery.mjs
          node web/e2e/theme.mjs
          node web/e2e/workflow-ui.mjs
      - name: Build deployment image and validate isolated runtime
        run: |
          node scripts/test-staging-config.mjs
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t pc-club-admin:local .
          docker pull caddy:2.11.2-alpine
          node scripts/test-container.mjs
          node scripts/test-staging.mjs
      - name: Container update backup and actual PostgreSQL restore
        shell: pwsh
        run: ./scripts/test-container-update.ps1
      - name: Browser setup, handover, history and remote manager
        env:
          PC_CLUB_BROWSER_TEST: '1'
          PC_CLUB_CHROMIUM: /usr/bin/google-chrome
        run: |
          test -x "$PC_CLUB_CHROMIUM"
          go test -race -tags=integration ./internal/httpapi -run 'TestSetupBrowser|TestHandoverBrowser' -count=1 -timeout=240s
      - run: |
          go run ./cmd/api &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/readyz
          curl --fail http://127.0.0.1:8080/api/v1/status
          curl --fail http://127.0.0.1:8080/ | grep 'lang="ru"'
      - name: Export the tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker image save --output "$RUNNER_TEMP/pc-club-image.tar" pc-club-admin:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image-${{ github.sha }}
          path: ${{ runner.temp }}/pc-club-image.tar
          if-no-files-found: error
          retention-days: 1
  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'eclipse-vlr/pc-club-admin'
    needs: [foundation, windows-launcher]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-image-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image-${{ github.sha }}
          path: ${{ runner.temp }}/tested-image
          digest-mismatch: error
      - name: Publish the exact image that passed CI
        id: image
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker image load --input "$RUNNER_TEMP/tested-image/pc-club-image.tar"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' pc-club-admin:local)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' pc-club-admin:local)" = "https://github.com/eclipse-vlr/pc-club-admin"
          image=ghcr.io/eclipse-vlr/pc-club-admin
          tag="$image:sha-$GITHUB_SHA"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          docker image tag pc-club-admin:local "$tag"
          docker image push "$tag"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
          [[ "$reference" =~ ^ghcr.io/eclipse-vlr/pc-club-admin@sha256:[0-9a-f]{64}$ ]]
          printf 'reference=%s\n' "$reference" >> "$GITHUB_OUTPUT"
          printf '### Tested container image\n\n<code>%s</code>\n\nWindows first launch:\n\n    .\\scripts\\start-container.ps1 -Image %s\n\nRequires Docker Desktop with Linux containers. Test data only; Drive is disabled.\n\nA new GHCR package may be private. Its owner must set the package visibility to Public before anonymous downloads work.\n' "$reference" "$reference" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Pull and test the published digest
        # This check uses the runtime just downloaded from GHCR, not a new build.
        env:
          PC_CLUB_TEST_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          docker image pull "$PC_CLUB_TEST_IMAGE"
          node scripts/test-staging.mjs
      - name: Prepare the Windows starter with the tested digest
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          mkdir -p "$RUNNER_TEMP/windows/scripts" "$RUNNER_TEMP/windows/deploy"
          cp start-container.cmd "$RUNNER_TEMP/windows/"
          cp scripts/start-container.ps1 "$RUNNER_TEMP/windows/scripts/"
          cp scripts/container-excel.ps1 "$RUNNER_TEMP/windows/scripts/"
          cp scripts/container-update.ps1 "$RUNNER_TEMP/windows/scripts/"
          cp deploy/compose.staging.yaml "$RUNNER_TEMP/windows/deploy/"
          cp deploy/compose.excel-test.yaml "$RUNNER_TEMP/windows/deploy/"
          printf '%s\n' "$RELEASE_IMAGE" > "$RUNNER_TEMP/windows/release-image.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PC-Club-Admin-Windows-${{ github.sha }}
          path: ${{ runner.temp }}/windows/
          if-no-files-found: error
          retention-days: 30
